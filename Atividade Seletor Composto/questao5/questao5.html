<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Campeões Brasileiros da Libertadores</title>

    <link rel="stylesheet" href="questao5.css">
</head>

<body>

    <table>

        <caption>
            Campeões Brasileiros da Libertadores

                <th>Ano(s)</th>
                <th>Maior time</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>
                    São Paulo
                    <img
                        src="saopaulo.png"
                        alt="Escudo do São Paulo"
                    >
                </td>
                <td>3</td>
                <td>1992, 1993 e 2005</td>
            </tr>

            <tr>
                <td>
                    Cruzeiro
                    <img
                        src="cruzeiro.jpg"
                        alt="Escudo do Cruzeiro"
                    >
                </td>
                <td>2</td>
                <td>1976 e 1997</td>
            </tr>

            <tr>
                <td>
                    Grêmio
                    <img
                        src="gremio.png"
                        alt="Escudo do Grêmio"
                    >
                </td>
                <td>2</td>
                <td>1983 e 1995</td>
            </tr>

            <tr>
                <td>
                    Santos
                    <img
                        src="santos.jpg"
                        alt="Escudo do Santos"
                    >
                </td>
                <td>2</td>
                <td>1962 e 1963</td>
                <td>Maior time da terra</td>
            </tr>

            <tr>
                <td>
                    Inter
                    <img
                        src="inter.png"
                        alt="Escudo do Internacional"
                    >
                </td>

            </tr>

                    >

                <td>1999</td>
            </tr>

            <tr>
                <td>
                    Vasco
                    <img
                        src="vasco.jpg"
                        alt="Escudo do Vasco"
                    >
                </td>
                <td>1</td>
                <td>1998</td>
            </tr>

            <tr>
                <td>
                    Flamengo
                    <img
                        src="flamengo.jpg"
                        alt="Escudo do Flamengo"
                    >
                </td>
                <td>1</td>
                <td>1981</td>
            </tr>

        </tbody>
