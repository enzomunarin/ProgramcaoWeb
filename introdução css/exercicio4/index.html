<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Identificação do Usuário</title>

    <style>
        
        

        /* Caixa principal */
        .container {
            width: 100%;
            max-width: 650px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        
        .titulo {
            text-align: center;
            color: #1565c0;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        
        form {
            width: 100%;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Campos de texto e seleção */
        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: #1565c0;
            box-shadow: 0 0 5px rgba(21, 101, 192, 0.3);
        }

        
        .sexo {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }

        .sexo label {
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }

        .sexo input {
            margin-right: 6px;
            cursor: pointer;
        }

    
        .botoes {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        input[type="submit"],
        input[type="reset"] {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"] {
            background-color: #1565c0;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #0d47a1;
        }

        input[type="reset"] {
            background-color: #e0e0e0;
            color: #333;
        }

        input[type="reset"]:hover {
            background-color: #bdbdbd;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .titulo {
                font-size: 24px;
            }

            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="titulo">Identificação do Usuário</h1>

        <p class="subtitulo">
            Preencha os dados abaixo para realizar o cadastro.
        </p>

        <form>

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="senha">Senha*:</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF*:</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>

            <div class="campo">
                <label>Sexo*:</label>

                <div class="sexo">
                    <label>
                        <input type="radio" name="sexo" value="masculino">
                        Masculino
                    </label>

                    <label>
                        <input type="radio" name="sexo" value="feminino">
                        Feminino
                    </label>
                </div>
            </div>

            <div class="campo">
                <label for="data_nascimento">Data Nascimento*:</label>
                <input type="text" id="data_nascimento" name="data_nascimento" required>
            </div>

            <div class="campo">
                <label for="estado_civil">Estado Civil*:</label>

                <select id="estado_civil" name="estado_civil" required>
                    <option>Solteiro</option>
                    <option>Casado</option>
                    <option>Divorciado</option>
                    <option>Viúvo</option>
                </select>
            </div>

            <div class="campo">
                <label for="escolaridade">Escolaridade:</label>

                <select id="escolaridade" name="escolaridade">
                    <option>Ensino Fundamental</option>
                    <option>Ensino Médio</option>
                    <option>Ensino Superior</option>
                    <option>Pós-graduação</option>
                </select>
            </div>

            <div class="campo">
                <label for="ocupacao_principal">Ocupação Principal:</label>
                <input type="text" id="ocupacao_principal" name="ocupacao_principal">
            </div>

            <div class="botoes">
                <input type="submit" value="Cadastrar">
                <input type="reset" value="Limpar">
            </div>

        </form>

    </div>

</body>

</html>
